<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Panel de Administración - Red Conecta San Juan</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <!-- ==================== ENCABEZADO ==================== -->
    <header class="header">
        <div class="header-inner">
            <a class="header-logo" href="index.html">
                <img src="assets/imagenes/logo.svg" alt="Logo Red Conecta San Juan" class="logo-img">
                <span class="logo-texto">Red Conecta <strong>San Juan</strong> · Admin</span>
            </a>
            <a class="btn btn-secundario btn-header" href="index.html">← Volver al inicio</a>
        </div>
    </header>

    <main class="container">

        <!-- ===================== LOGIN ===================== -->
        <div id="login-panel" class="auth-panel">
            <h2>Iniciar sesión</h2>
            <p class="auth-subtitulo">Accedé con tu cuenta de administración</p>

            <div id="login-mensaje" class="mensaje"></div>

            <form id="login-form" novalidate>
                <div class="campo" id="login-email-grupo">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="admin@conecta.com" autocomplete="email">
                    <span class="campo-error">Ingresá un email válido</span>
                </div>
                <div class="campo" id="login-password-grupo">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
                    <span class="campo-error">Ingresá tu contraseña</span>
                </div>
                <button type="submit" class="btn btn-primario btn-block" id="btn-login">
                    <span class="spinner spinner-oscuro"></span>
                    Entrar
                </button>
            </form>
        </div>

        <!-- ===================== PANEL DE REGISTROS ===================== -->
        <section id="admin-panel" hidden>
            <div class="admin-header">
                <h2 class="admin-titulo">Registros de la Red</h2>
                <div>
                    <span class="header-usuario-nombre">👤 <span id="usuario-nombre"></span></span>
                    <button class="btn btn-secundario btn-sm" id="btn-cerrar-sesion">Cerrar sesión</button>
                </div>
            </div>

            <div id="admin-mensaje" class="mensaje"></div>

            <div class="table-wrap">
                <table class="tabla-admin">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Tipo de perfil</th>
                            <th>Localidad</th>
                            <th>WhatsApp</th>
                            <th>Red</th>
                            <th>Archivo</th>
                            <th>Detalles</th>
                            <th>Autoriza</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-registros">
                        <tr>
                            <td colspan="11">
                                <div class="empty-state">
                                    <span class="empty-icono">⏳</span>
                                    Cargando registros…
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- ==================== SCRIPTS ==================== -->
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginPanel = document.getElementById('login-panel');
            const adminPanel = document.getElementById('admin-panel');
            const mensajeLogin = document.getElementById('login-mensaje');
            const mensajeAdmin = document.getElementById('admin-mensaje');

            /* ==================== UTILIDADES ==================== */

            function mostrarMensaje(contenedor, texto, tipo) {
                contenedor.textContent = texto;
                contenedor.className = 'mensaje mensaje-' + tipo + ' visible';
            }

            function validarCampo(grupoId, condicionValida) {
                const grupo = document.getElementById(grupoId);
                if (condicionValida()) {
                    grupo.classList.remove('invalido');
                    return true;
                }
                grupo.classList.add('invalido');
                return false;
            }

            function esEmailValido(email) {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            }

            /* ==================== LOGIN ==================== */

            document.getElementById('login-form').addEventListener('submit', async function(e) {
                e.preventDefault();

                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;

                const emailOk = validarCampo('login-email-grupo', () => esEmailValido(email));
                const passOk = validarCampo('login-password-grupo', () => password.length > 0);
                if (!emailOk || !passOk) return;

                const btn = document.getElementById('btn-login');
                btn.disabled = true;
                btn.classList.add('btn-loading');

                try {
                    await iniciarSesion(email, password);
                    mostrarPanelAdmin();
                } catch (error) {
                    mostrarMensaje(mensajeLogin, '❌ ' + error.message, 'error');
                } finally {
                    btn.disabled = false;
                    btn.classList.remove('btn-loading');
                }
            });

            /* ==================== PANEL ADMIN ==================== */

            function mostrarPanelAdmin() {
                loginPanel.hidden = true;
                adminPanel.hidden = false;
                document.getElementById('usuario-nombre').textContent = nombreUsuario();
                cargarRegistros();
            }

            document.getElementById('btn-cerrar-sesion').addEventListener('click', function() {
                cerrarSesion(true);
            });

            // Nombres legibles de los tipos de perfil
            const etiquetasPerfil = {
                profesional: 'Profesional',
                tecnico: 'Técnico / oficio',
                busco_trabajo: 'Busco trabajo',
                emprendedor: 'Emprendedor/a',
                empresa: 'Empresa / PyME',
                estudiante: 'Estudiante',
                institucion: 'Institución'
            };

            function escapar(texto) {
                const div = document.createElement('div');
                div.textContent = texto;
                return div.innerHTML;
            }

            function formatearFecha(iso) {
                if (!iso) return '—';
                const fecha = new Date(iso);
                if (isNaN(fecha)) return '—';
                return fecha.toLocaleDateString('es-AR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }

            // Resumen legible de preferencias + datos del perfil
            function resumenDetalles(registro) {
                const partes = [];

                const detalles = registro.perfil_detalles || {};
                const camposLegibles = {
                    profesion: 'Profesión',
                    especialidad: 'Especialidad',
                    experiencia: 'Experiencia',
                    interes: 'Interés',
                    nombre_emprendimiento: 'Emprendimiento',
                    rubro: 'Rubro',
                    localidad_emprendimiento: 'Localidad',
                    ofreces: 'Ofrece',
                    nombre_empresa: 'Empresa',
                    carrera: 'Carrera',
                    institucion: 'Institución',
                    anio_cursado: 'Año',
                    nombre_institucion: 'Institución'
                };

                Object.keys(camposLegibles).forEach((clave) => {
                    if (detalles[clave]) {
                        const valor = Array.isArray(detalles[clave])
                            ? detalles[clave].join(', ')
                            : String(detalles[clave]);
                        if (valor) partes.push(`<strong>${camposLegibles[clave]}:</strong> ${escapar(valor)}`);
                    }
                });

                if (Array.isArray(registro.preferencias) && registro.preferencias.length) {
                    partes.push(`<strong>Quiere encontrar:</strong> ${escapar(registro.preferencias.join(', '))}`);
                }

                return partes.join('<br>') || '—';
            }

            async function cargarRegistros() {
                const tbody = document.getElementById('tabla-registros');

                try {
                    const registros = await listarRegistros();

                    if (!registros.length) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="11">
                                    <div class="empty-state">
                                        <span class="empty-icono">🌱</span>
                                        Todavía no hay registros en la red.
                                    </div>
                                </td>
                            </tr>
                        `;
                        return;
                    }

                    tbody.innerHTML = registros.map((registro) => `
                        <tr>
                            <td>${escapar(formatearFecha(registro.fecha_registro))}</td>
                            <td><strong>${escapar(registro.nombre_apellido)}</strong></td>
                            <td>${escapar(registro.email || '')}</td>
                            <td><span class="badge badge-perfil">${escapar(etiquetasPerfil[registro.tipo_perfil] || registro.tipo_perfil || '')}</span></td>
                            <td>${escapar(registro.localidad || '')}</td>
                            <td>${escapar(registro.whatsapp || '')}</td>
                            <td>${escapar(registro.red_social || '')}</td>
                            <td>${registro.archivo_url
                                ? `<a href="${escapar(registro.archivo_url)}" target="_blank" rel="noopener">${escapar(registro.archivo_nombre || 'Ver archivo')}</a>`
                                : '—'}</td>
                            <td class="celda-descripcion">${resumenDetalles(registro)}</td>
                            <td>
                                ${registro.autoriza_datos ? '✅ Datos' : '❌ Datos'}
                                ${registro.autoriza_contacto ? '· ✅ Contacto' : '· ❌ Contacto'}
                            </td>
                            <td class="acciones-cell">
                                <button type="button" class="btn btn-danger btn-sm" data-eliminar="${registro.id}" data-nombre="${escapar(registro.nombre_apellido)}">Eliminar</button>
                            </td>
                        </tr>
                    `).join('');

                    // Delegación: eliminar registros
                    tbody.querySelectorAll('[data-eliminar]').forEach((btn) => {
                        btn.addEventListener('click', async () => {
                            const nombre = btn.dataset.nombre;
                            if (!confirm(`¿Eliminar el registro de "${nombre}"? Esta acción no se puede deshacer.`)) return;

                            btn.disabled = true;
                            try {
                                await eliminarRegistro(btn.dataset.eliminar);
                                mostrarMensaje(mensajeAdmin, '✅ Registro eliminado.', 'exito');
                                cargarRegistros();
                            } catch (error) {
                                btn.disabled = false;
                                mostrarMensaje(mensajeAdmin, '❌ ' + error.message, 'error');
                            }
                        });
                    });

                } catch (error) {
                    const esPGRST205 = error.message.includes('PGRST205') || error.message.includes('Could not find the table');
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="11">
                                <div class="empty-state">
                                    <span class="empty-icono">${esPGRST205 ? '🛠️' : '⚠️'}</span>
                                    ${esPGRST205
                                        ? 'La tabla <strong>registros</strong> no existe en Supabase. Ejecutá <strong>sql/setup_conecta.sql</strong> en el SQL Editor: copialo desde el archivo con el Bloc de notas (no desde un visor con formato), pegá el contenido, hacé <strong>Run</strong> y luego recargá esta página.'
                                        : 'No se pudieron cargar los registros. Revisá que las políticas RLS estén configuradas (ejecutá sql/setup_conecta.sql) y que la sesión sea válida.'}
                                    <br><small>${escapar(error.message)}</small>
                                </div>
                            </td>
                        </tr>
                    `;
                }
            }

            /* ==================== INICIO ==================== */

            if (verificarSesion()) {
                mostrarPanelAdmin();
            }
        });
    </script>
</body>
</html>
